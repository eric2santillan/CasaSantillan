<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Casa Board</title>
<link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<style>
  /* This file contains no household data. Everything shown is decrypted in the browser from data.enc.json. */
  /* Fonts: SIL OFL, self-hosted (Fontsource latin subsets). Fraunces for display, Atkinson Hyperlegible Next for reading. */
  @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
  :root {
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Atkinson Hyperlegible Next", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --bg: #f6f3ee; --card: #ffffff; --ink: #1f1d1a; --muted: #655f57; --line: #e8e2d8;
    --accent: #6f4596; --accent-soft: #f1eaf7;
    --off-bg: #fbecd6; --off-ink: #7a4a0c; --school-bg: #e3f1e8; --school-ink: #1f5c39; --free-bg: #efebe5; --free-ink: #5d574f;
    --warn: #b3261e; --warn-soft: #fde8e6; --ok: #2e7d4f;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --card: #221f1c; --ink: #f3efe9; --muted: #aaa298; --line: #35312c;
      --accent: #cdb0ea; --accent-soft: #2f2738;
      --off-bg: #3b2d17; --off-ink: #f3c98b; --school-bg: #1d3226; --school-ink: #9fdcb6; --free-bg: #2c2925; --free-ink: #bdb5aa;
      --warn: #ff8a80; --warn-soft: #3a1f1d; --ok: #7fd1a0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614; --card: #221f1c; --ink: #f3efe9; --muted: #aaa298; --line: #35312c;
    --accent: #cdb0ea; --accent-soft: #2f2738;
    --off-bg: #3b2d17; --off-ink: #f3c98b; --school-bg: #1d3226; --school-ink: #9fdcb6; --free-bg: #2c2925; --free-ink: #bdb5aa;
    --warn: #ff8a80; --warn-soft: #3a1f1d; --ok: #7fd1a0;
  }
  * { box-sizing: border-box; }
  /* Fluid base: ~17px on phones, ~19px on a portrait tablet, ~21px on a landscape kitchen tablet */
  html { font-size: clamp(17px, 0.9rem + 0.45vw, 21px); }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 1rem; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 1.25rem 16px 3rem; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
  .date { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.1rem, 1.4rem + 2.6vw, 3.4rem); line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; letter-spacing: 0.01em; }
  .pill { font-size: 0.8rem; color: var(--muted); background: var(--card); border: 1px solid var(--line); padding: 0.35rem 0.8rem; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .stale { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius); padding: 0.8rem 1rem; margin-bottom: 1rem; font-weight: 700; }
  .banners { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.1rem; }
  .banner { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 0.45rem 0.95rem; font-weight: 700; font-size: 0.95rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1.45fr 1fr; } }
  .stack { display: grid; gap: 1rem; align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem 1.2rem; }
  .card h2 { margin: 0 0 0.85rem; font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .card h2 .h2-day { text-transform: none; letter-spacing: 0.02em; font-weight: 600; }

  /* Day cards */
  .person { display: grid; grid-template-columns: 8.2rem 1fr; gap: 0.9rem; padding: 0.85rem 0; border-top: 1px solid var(--line); align-items: start; }
  .person:first-of-type { border-top: 0; padding-top: 0.15rem; }
  .who { display: flex; align-items: center; gap: 0.45rem; font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; letter-spacing: -0.01em; }
  .who .em { width: 1.35em; flex: none; text-align: center; font-size: 0.95em; }
  .items { display: flex; flex-direction: column; gap: 0.45rem; padding-top: 0.15rem; }
  .item { display: grid; grid-template-columns: 5.4rem 1fr; gap: 0.6rem; align-items: baseline; }
  .time { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; font-size: 1rem; white-space: nowrap; }
  .time.allday { font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .what { font-size: 1.08rem; font-weight: 500; line-height: 1.35; text-wrap: pretty; }
  .note { color: var(--muted); font-size: 0.86rem; font-weight: 400; line-height: 1.4; }
  .tag { display: inline-block; align-self: flex-start; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em; padding: 0.22em 0.7em; border-radius: 999px; background: var(--free-bg); color: var(--free-ink); }
  .tag.off { background: var(--off-bg); color: var(--off-ink); }
  .tag.school { background: var(--school-bg); color: var(--school-ink); }
  .quiet { color: var(--muted); }
  .ic { margin-right: 0.4em; font-family: var(--font-body); font-weight: 400; }
  /* Tomorrow: one step smaller and quieter, so Today wins the glance */
  .card.later .who { font-size: 1.1rem; }
  .card.later .what { font-size: 0.98rem; }
  .card.later .time { font-size: 0.92rem; }
  .card.later .person { padding: 0.6rem 0; }

  /* Meals */
  .meal { padding: 0.55rem 0; border-top: 1px solid var(--line); }
  .meal:first-of-type { border-top: 0; padding-top: 0; }
  .meal b { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.1rem; }
  .meal span { font-size: 1.1rem; font-weight: 500; line-height: 1.35; text-wrap: pretty; }

  /* To prepare */
  .prep { border-top: 1px solid var(--line); padding: 0.9rem 0 0.4rem; }
  .prep:first-of-type { border-top: 0; padding-top: 0; }
  .prep-when { color: var(--accent); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .prep-title { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.2; letter-spacing: -0.01em; margin: 0.15rem 0 0.25rem; text-wrap: balance; }
  label.check { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.45rem 0; cursor: pointer; font-size: 1.05rem; line-height: 1.35; }
  label.check input { width: 1.5rem; height: 1.5rem; margin: 0; accent-color: var(--ok); flex: none; }
  label.check.done span { text-decoration: line-through; color: var(--muted); }

  /* Coming up */
  .up { display: grid; grid-template-columns: 4.6rem 1fr; gap: 0.8rem; padding: 0.6rem 0; border-top: 1px solid var(--line); align-items: baseline; }
  .up:first-of-type { border-top: 0; padding-top: 0; }
  .up .d { display: flex; flex-direction: column; line-height: 1.1; }
  .up .wd { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .up .dn { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .up .what { font-size: 1rem; }

  /* Lock screen */
  .lock { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .lock form { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.75rem; width: min(400px, 100%); display: grid; gap: 0.9rem; }
  .lock h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 2rem; letter-spacing: -0.02em; }
  .lock input[type=password] { font: inherit; font-size: 1.05rem; padding: 0.75rem 0.9rem; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
  .lock button { font: inherit; font-weight: 700; font-size: 1.05rem; padding: 0.75rem; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  :root[data-theme="dark"] .lock button { color: #171614; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lock button { color: #171614; } }
  .err { color: var(--warn); font-size: 0.9rem; min-height: 1em; }
  footer { margin-top: 1.4rem; display: flex; justify-content: space-between; gap: 0.75rem; color: var(--muted); font-size: 0.78rem; flex-wrap: wrap; }
  footer button { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
  @media (max-width: 560px) {
    .person { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 0.75rem; }
    .person .items { flex-basis: 100%; }
    .person .items:has(> .tag:only-child), .person .items:has(> .quiet:only-child) { flex-basis: auto; padding-top: 0; }
    .who { font-size: 1.25rem; }
    .item { grid-template-columns: 4.9rem 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const TZ = "Asia/Manila";
  const STALE_HOURS = 30;
  // Names live only in the encrypted payload (DATA.people) — nothing identifying sits in this public file.
  let PEOPLE = [];
  const kidIcon = (w) => { const p = PEOPLE.find((x) => x.id === w && x.school); return p ? p.label.split(" ")[0] : ""; };
  const app = document.getElementById("app");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

  // ---------- dates (always Manila) ----------
  const isoIn = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00+08:00"); d.setUTCDate(d.getUTCDate() + n); return isoIn(d); };
  const fmtDay = (iso, opts) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...opts }).format(new Date(iso + "T12:00:00+08:00"));
  const fmtTime = (s) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).format(new Date(s));
  const evStart = (e) => (e.allDay ? e.start.slice(0, 10) : isoIn(new Date(e.start)));
  const evEnd = (e) => (e.allDay ? e.end.slice(0, 10) : addDays(evStart(e), 1)); // exclusive
  const on = (e, day) => evStart(e) <= day && day < evEnd(e);
  const multiDay = (e) => e.allDay && evEnd(e) > addDays(evStart(e), 1);
  const isWeekday = (iso) => !["Sat", "Sun"].includes(fmtDay(iso, { weekday: "short" }));
  const NO_SCHOOL = /break|no class|staff dev|holiday|last day of school/i;

  // ---------- crypto ----------
  async function deriveKey(pass, saltB64, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(saltB64), iterations: iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function decrypt(key, blob) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function fetchBlob() {
    const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("Could not load the board data (" + r.status + ").");
    return r.json();
  }
  async function rememberedKey(blob) {
    const raw = store.get("casa.key"), salt = store.get("casa.salt");
    if (!raw || salt !== blob.salt) return null;
    return crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]);
  }

  // ---------- state ----------
  let KEY = null, DATA = null;

  function showLock(message) {
    app.innerHTML = `
      <div class="lock"><form id="f" autocomplete="on">
        <h1>🏡 Casa</h1>
        <div class="sub">Enter the household passphrase.</div>
        <input type="text" name="username" value="casa" autocomplete="username" hidden>
        <input id="p" type="password" autocomplete="current-password" placeholder="Passphrase" required>
        <label class="check" style="padding:0"><input id="r" type="checkbox" checked><span>Remember on this device</span></label>
        <button type="submit">Open</button>
        <div class="err" id="e">${esc(message || "")}</div>
      </form></div>`;
    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const e = document.getElementById("e");
      e.textContent = "Opening…";
      try {
        const blob = await fetchBlob();
        const key = await deriveKey(document.getElementById("p").value, blob.salt, blob.iter);
        DATA = await decrypt(key, blob);
        PEOPLE = DATA.people || [];
        KEY = key;
        if (document.getElementById("r").checked) {
          store.set("casa.key", toB64(await crypto.subtle.exportKey("raw", key)));
          store.set("casa.salt", blob.salt);
        }
        render();
      } catch (err) {
        e.textContent = err.name === "OperationError" ? "That passphrase didn't work." : err.message;
      }
    });
    document.getElementById("p").focus();
  }

  async function refresh() {
    try {
      const blob = await fetchBlob();
      if (!KEY) KEY = await rememberedKey(blob);
      if (!KEY) return showLock();
      DATA = await decrypt(KEY, blob);
      PEOPLE = DATA.people || [];
      render();
    } catch (err) {
      if (DATA) return render(); // keep showing what we have; the stale banner will say how old it is
      KEY = null; store.del("casa.key");
      showLock(err.name === "OperationError" ? "The passphrase has changed. Enter the new one." : err.message);
    }
  }

  // ---------- render ----------
  function personLines(day, p) {
    const evs = DATA.events.filter((e) => on(e, day) && e.who.includes(p.id));
    const banners = evs.filter((e) => e.allDay && (multiDay(e) || NO_SCHOOL.test(e.title)));
    const items = evs.filter((e) => !banners.includes(e) && !(p.id === "home" && e.checklist.length))
      .sort((a, b) => (a.allDay ? "" : a.start).localeCompare(b.allDay ? "" : b.start));
    // School status for kids: a no-school banner that covers them (their own or a household one)
    let status = "";
    if (p.school) {
      const off = DATA.events.find((e) => on(e, day) && e.allDay && NO_SCHOOL.test(e.title) && (e.who.includes(p.id) || e.who.includes("home")));
      const away = DATA.events.find((e) => on(e, day) && e.allDay && multiDay(e) && e.who.includes("home") && !NO_SCHOOL.test(e.title));
      if (off) status = "No school";
      else if (away && !isWeekday(day)) status = "";
      else if (isWeekday(day)) status = "School day";
    }
    return { items, status };
  }

  const whoHTML = (label) => { const i = label.indexOf(" "); return `<span class="em">${esc(label.slice(0, i))}</span><span>${esc(label.slice(i + 1))}</span>`; };
  const tagHTML = (status) => status ? `<span class="tag ${status === "No school" ? "off" : status === "School day" ? "school" : ""}">${esc(status)}</span>` : "";

  function dayCard(day, title, later) {
    const rows = PEOPLE.map((p) => {
      const { items, status } = personLines(day, p);
      const list = items.map((e) => `
        <div class="item"><span class="time${e.allDay ? " allday" : ""}">${e.allDay ? "All day" : esc(fmtTime(e.start))}</span>
        <div class="what">${e.who.includes("home") ? `<span class="ic">${esc(e.icon)}</span>` : ""}${esc(e.title)}${e.location ? `<div class="note">${esc(e.location)}</div>` : ""}${e.note && p.id !== "home" ? `<div class="note">${esc(e.note)}</div>` : ""}</div></div>`).join("");
      const empty = p.id === "home" ? `<span class="quiet">Nothing scheduled</span>` : tagHTML(status || "Free");
      const head = items.length ? tagHTML(status) : "";
      return `<div class="person"><div class="who">${whoHTML(p.label)}</div><div class="items">${head}${list || empty}</div></div>`;
    }).join("");
    return `<section class="card${later ? " later" : ""}"><h2>${title}</h2>${rows}</section>`;
  }

  function mealsCard(day, title) {
    const m = (DATA.meals || {})[day];
    const body = m ? ["breakfast", "lunch", "dinner"].map((k) => `<div class="meal"><b>${k}</b><span>${esc(m[k] || "—")}</span></div>`).join("")
      : `<div class="quiet">No menu for this day yet.</div>`;
    return `<section class="card"><h2>${esc(title)}</h2>${body}</section>`;
  }

  function prepCard(today) {
    const until = addDays(today, 4);
    const preps = DATA.events.filter((e) => e.checklist.length && evStart(e) >= today && evStart(e) < until)
      .sort((a, b) => a.start.localeCompare(b.start));
    if (!preps.length) return "";
    const body = preps.map((e) => {
      const when = evStart(e) === today ? "Today" : evStart(e) === addDays(today, 1) ? "Tomorrow" : fmtDay(evStart(e), { weekday: "long" });
      const checks = e.checklist.map((c, i) => {
        const k = `casa.chk.${evStart(e)}.${e.title}.${i}`;
        const done = store.get(k) === "1";
        return `<label class="check ${done ? "done" : ""}"><input type="checkbox" data-k="${esc(k)}" ${done ? "checked" : ""}><span>${esc(c)}</span></label>`;
      }).join("");
      return `<div class="prep"><div class="prep-when">${esc(when)}${e.allDay ? "" : " · " + esc(fmtTime(e.start))}</div>
        <div class="prep-title"><span class="ic">${esc(e.icon)}</span>${esc(e.title)}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}${checks}</div>`;
    }).join("");
    return `<section class="card"><h2>To prepare</h2>${body}</section>`;
  }

  function upcomingCard(today) {
    const from = addDays(today, 2), to = addDays(today, 15);
    const seen = new Set();
    const ups = DATA.events.filter((e) => evStart(e) >= from && evStart(e) < to && !e.checklist.length)
      .filter((e) => { const k = e.title; if (seen.has(k) && !e.allDay) return false; seen.add(k); return true; }) // recurring: show next one only
      .sort((a, b) => a.start.localeCompare(b.start)).slice(0, 12);
    if (!ups.length) return "";
    const icon = (e) => e.who.map((w) => kidIcon(w)).join("") || e.icon;
    const wd = (iso) => fmtDay(iso, { weekday: "short" });
    const dn = (iso) => fmtDay(iso, { day: "numeric" });
    const body = ups.map((e) => {
      const a = evStart(e), b = addDays(evEnd(e), -1);
      const d = multiDay(e) ? `<span class="wd">${esc(wd(a))}–${esc(wd(b))}</span><span class="dn">${esc(dn(a))}–${esc(dn(b))}</span>`
        : `<span class="wd">${esc(wd(a))} · ${esc(fmtDay(a, { month: "short" }))}</span><span class="dn">${esc(dn(a))}</span>`;
      return `<div class="up"><div class="d">${d}</div><div class="what"><span class="ic">${esc(icon(e))}</span>${esc(e.title)}${e.allDay ? "" : `<div class="note">${esc(fmtTime(e.start))}</div>`}</div></div>`;
    }).join("");
    return `<section class="card"><h2>Coming up</h2>${body}</section>`;
  }

  function render() {
    const now = new Date();
    const today = isoIn(now), tomorrow = addDays(today, 1);
    const gen = new Date(DATA.generatedAt);
    const ageH = (now - gen) / 36e5;
    const updated = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit" }).format(gen);
    const banners = DATA.events.filter((e) => on(e, today) && e.allDay && (multiDay(e) || NO_SCHOOL.test(e.title)))
      .map((e) => { const icons = e.who.map((w) => kidIcon(w)).join(""); return `<span class="banner">${esc(icons || e.icon)} ${esc(e.title)}</span>`; }).join("");
    app.innerHTML = `
      <div class="wrap">
        ${ageH > STALE_HOURS ? `<div class="stale">⚠️ This board hasn't updated since ${esc(updated)}. Check the FAMILY calendar for anything new.</div>` : ""}
        <header>
          <div><div class="date">${esc(fmtDay(today, { weekday: "long", month: "long", day: "numeric" }))}</div><div class="sub">${esc(DATA.household || "")}</div></div>
          <span class="pill">Updated ${esc(updated)}</span>
        </header>
        ${banners ? `<div class="banners">${banners}</div>` : ""}
        <div class="grid">
          <div class="stack">${dayCard(today, "Today")}${dayCard(tomorrow, `Tomorrow <span class="h2-day">· ${esc(fmtDay(tomorrow, { weekday: "long" }))}</span>`, true)}</div>
          <div class="stack">${mealsCard(today, "Today's meals")}${prepCard(today)}${upcomingCard(today)}</div>
        </div>
        <footer><span>Changes go on the FAMILY calendar. This board updates at 6 AM and 5 PM.</span><button id="lockbtn" type="button">Lock this device</button></footer>
      </div>`;
    app.querySelectorAll("input[data-k]").forEach((cb) => cb.addEventListener("change", () => {
      cb.checked ? store.set(cb.dataset.k, "1") : store.del(cb.dataset.k);
      cb.closest("label").classList.toggle("done", cb.checked);
    }));
    document.getElementById("lockbtn").addEventListener("click", () => { store.del("casa.key"); store.del("casa.salt"); KEY = null; DATA = null; showLock(); });
  }

  refresh();
  setInterval(refresh, 30 * 60 * 1000);           // pick up the 6 AM / 5 PM rebuilds
  setInterval(() => DATA && render(), 5 * 60 * 1000); // roll over "today" at midnight
})();
</script>
</body>
</html>
